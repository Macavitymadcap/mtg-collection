name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a pull request cancels its older run. Runs on main aren't
# cancelled, so a deploy is never stopped halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Matches docker-compose.yml and apps/api/.env.test: port 3310, user app/app, database mtg_test
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mtg_test
          MYSQL_USER: app
          MYSQL_PASSWORD: app
        ports:
          - 3310:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Format
        run: npm run format:check

      # Also builds @mtg/shared and generates tsoa routes and Next's route types
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Read by apps/web/src/lib/env.ts during the build; not used to call anything
          API_BASE_URL: http://localhost:3400/api
          API_JWT_SECRET: ci-only-not-a-real-secret

      # Fails if coverage drops below the thresholds in each workspace's vitest config
      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            apps/api/coverage
            apps/web/coverage
          if-no-files-found: ignore
          retention-days: 14

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      # Starts the fake Scryfall, the API (on mtg_test) and the built web app; see apps/web/playwright.config.ts
      - name: Browser tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14

      # Reported, not enforced: the open advisories are in dev tooling
      - name: Audit dependencies
        continue-on-error: true
        run: npm audit --audit-level=moderate

  # After the checks pass on main: Cloudflare resources (Pulumi), database
  # migrations, then both Workers. Modelled on the shelf repo's deploy job.
  deploy:
    name: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One deploy at a time, in order
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Builds @mtg/shared and generates tsoa routes, which the Workers bundle
      - name: Generate code
        run: npm run codegen

      # Creates or updates the Hyperdrive config; the stack's state is in Pulumi Cloud
      - name: Cloudflare resources
        id: pulumi
        uses: pulumi/actions@v6
        with:
          command: up
          stack-name: prod
          work-dir: infra
          upsert: true
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          MTG_DB_PASSWORD: ${{ secrets.MTG_DB_PASSWORD }}

      - name: Point the API at the Hyperdrive config
        run: npx tsx infra/scripts/sync-wrangler.ts "${{ steps.pulumi.outputs.hyperdriveId }}"

      # Straight to the database over verified TLS, not through Hyperdrive
      # (which doesn't support everything migrations do). Settings as in infra/Pulumi.prod.yaml.
      - name: Migrate the database
        run: DB_SSL_CA="$(cat infra/aiven-ca.pem)" npm run db:migrate:deploy -w @mtg/api
        env:
          NODE_ENV: production
          DB_HOST: mysql-22a666f9-danielthekiernan-c773.g.aivencloud.com
          DB_PORT: "27123"
          DB_NAME: mtg
          DB_USER: mtg_app
          DB_PASSWORD: ${{ secrets.MTG_DB_PASSWORD }}
          DB_POOL_MIN: "0"
          # Required by the API's config, not used by migrations
          JWT_SECRET: not-used-by-migrations
          AUTH_SECRET: not-used-by-migrations-0123456789abcdef

      # The Workers' secrets were set once (see the README) and stay across deploys
      - name: Deploy the API
        run: npx wrangler deploy
        working-directory: apps/api

      - name: Build and deploy the web app
        run: npm run cf:build && npx wrangler deploy
        working-directory: apps/web
        env:
          # Read by apps/web/src/lib/env.ts during the build; the Worker's own vars and secrets are used at runtime
          API_BASE_URL: https://mtg-api.internal/api
          API_JWT_SECRET: build-only-not-a-real-secret
